<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#2a1515 #000}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#2a1515;border-radius:3px}
:root{
--bg:#050305;--text:#c4b8a0;--accent:#8b0000;--accent2:#4a0000;
--gold:#a08060;--dim:#1a1512;--card:#0e0a0a;--teal:#0a3030;
--font-serif:"Noto Serif SC","Georgia",serif
}
body{
background:var(--bg);color:var(--text);font-family:var(--font-serif);
line-height:1.7;overflow-x:hidden;
background-image:radial-gradient(ellipse at 50% 0%,#0d0d0d 0%,#030303 70%);
}
#fog{
position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
background:url("data:image/svg+xml,%3Csvg viewBox='0 0 800 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
animation:fogMove 60s linear infinite;
}
@keyframes fogMove{0%{background-position:0 0}100%{background-position:800px 600px}}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.main-nav{
position:sticky;top:0;z-index:1000;height:64px;
background:linear-gradient(135deg,#0a0202 0%,#150505 50%,#0a0202 100%);
border-bottom:1px solid #1a0a0a;backdrop-filter:blur(10px);
display:flex;align-items:center;justify-content:space-between;padding:0 30px;
}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo-icon{font-size:1.6em;filter:grayscale(0.3)}
.nav-logo-text{font-size:1.1em;letter-spacing:4px;color:var(--accent);font-weight:600}
.nav-menu{display:flex;gap:30px;list-style:none}
.nav-item a{
color:#887766;text-decoration:none;font-size:0.9em;letter-spacing:2px;
transition:color 0.3s;position:relative
}
.nav-item a:hover,.nav-item a.active{color:#d4a574}
.nav-item a::after{
content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;
background:var(--accent);transition:width 0.3s
}
.nav-item a:hover::after,.nav-item a.active::after{width:100%}
.nav-hud{display:flex;align-items:center;gap:15px}
.sanity-label{font-size:0.75em;color:#554433;letter-spacing:2px}
.sanity-bar{width:80px;height:6px;background:#1a0a0a;border-radius:3px;overflow:hidden}
.sanity-fill{height:100%;background:linear-gradient(90deg,#882222,#cc4444);transition:width 0.6s;border-radius:3px}
.sanity-fill.low{background:linear-gradient(90deg,#cc6622,#ff8833)}
.sanity-fill.crit{animation:sanityPulse 0.6s infinite}
@keyframes sanityPulse{0%,100%{opacity:1}50%{opacity:0.3}}
.inv-count{font-size:0.85em;color:#aa8855;background:rgba(139,0,0,0.15);padding:4px 12px;border-radius:12px;border:1px solid #2a1515}
#hero{
position:relative;height:100vh;min-height:600px;display:flex;align-items:center;justify-content:center;
overflow:hidden
}
#hero::before{
content:'';position:absolute;top:0;left:0;width:100%;height:100%;
background:linear-gradient(180deg,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.6) 50%,var(--bg) 100%);
z-index:1
}
.hero-bg{
position:absolute;top:0;left:0;width:100%;height:120%;
background:radial-gradient(ellipse at 40% 30%,#1a0a0a 0%,#050305 60%,#000 100%);
z-index:0
}
.hero-parallax{
position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;
background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.005) 2px,rgba(255,255,255,0.005) 4px);
transform:perspective(500px) rotateX(30deg) translateY(-20%);
}
.hero-content{
position:relative;z-index:2;text-align:center;padding:40px
}
.hero-title{
font-size:clamp(2.5em,6vw,5em);color:#c4a080;letter-spacing:12px;font-weight:900;
text-shadow:0 0 60px rgba(139,0,0,0.4),0 0 120px rgba(0,0,0,0.8);
animation:heroFadeIn 2s ease-out
}
.hero-subtitle{
font-size:clamp(0.9em,2vw,1.3em);color:#887766;letter-spacing:8px;
margin:20px 0 30px;animation:heroFadeIn 2s ease-out 0.3s both
}
.hero-btn{
display:inline-block;padding:16px 50px;border:2px solid var(--accent);color:#cc8888;
text-decoration:none;letter-spacing:6px;font-size:1.1em;border-radius:2px;
transition:all 0.5s;cursor:pointer;background:transparent;font-family:inherit;
animation:heroFadeIn 2s ease-out 0.6s both
}
.hero-btn:hover{
background:rgba(139,0,0,0.2);box-shadow:0 0 40px rgba(139,0,0,0.3);
text-shadow:0 0 20px rgba(200,100,100,0.5);transform:scale(1.02)
}
@keyframes heroFadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.hero-scroll{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:2;
animation:bounce 2s infinite;color:#554433;font-size:1.5em;cursor:pointer}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(10px)}}
.section{position:relative;padding:80px 30px;z-index:1}
.section-dark{background:linear-gradient(180deg,var(--bg) 0%,#080505 100%)}
.section-darker{background:#020102}
.container{max-width:1100px;margin:0 auto}
.section-header{text-align:center;margin-bottom:50px}
.section-title{
font-size:clamp(1.6em,3vw,2.4em);color:#d4a574;letter-spacing:8px;margin-bottom:12px
}
.section-subtitle{font-size:0.9em;color:#665544;letter-spacing:4px;font-style:italic}
.section-divider{width:60px;height:2px;background:var(--accent);margin:20px auto 0}
.room-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.room-card{
background:var(--card);border:1px solid #1a0f0f;border-radius:6px;overflow:hidden;
transition:all 0.4s;cursor:pointer;position:relative
}
.room-card:hover{
transform:translateY(-4px);border-color:var(--accent);
box-shadow:0 8px 30px rgba(139,0,0,0.15)
}
.room-card-img{
height:160px;background:linear-gradient(135deg,#1a0a0a 0%,#0d0505 100%);
display:flex;align-items:center;justify-content:center;font-size:3em;
border-bottom:1px solid #1a0f0f;position:relative;overflow:hidden
}
.room-card-img::after{
content:'';position:absolute;top:0;left:0;width:100%;height:100%;
background:linear-gradient(180deg,transparent,rgba(0,0,0,0.6))
}
.room-card-body{padding:20px}
.room-card-title{font-size:1.15em;color:#c4a080;letter-spacing:4px;margin-bottom:8px}
.room-card-desc{font-size:0.85em;color:#665544;line-height:1.6}
.room-card-status{
display:inline-block;margin-top:10px;font-size:0.75em;
padding:3px 10px;border-radius:10px;letter-spacing:2px
}
.status-unexplored{background:rgba(139,0,0,0.2);color:#884444;border:1px solid #4a1515}
.status-explored{background:rgba(60,100,60,0.2);color:#668866;border:1px solid #2a3a2a}
#room-modal{
display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:2000;
background:rgba(0,0,0,0.92);justify-content:center;align-items:center;padding:20px
}
#room-modal.open{display:flex}
.modal-content{
background:var(--card);border:2px solid #2a1515;border-radius:8px;max-width:650px;
width:100%;max-height:85vh;overflow-y:auto;padding:35px;position:relative
}
.modal-close{
position:absolute;top:15px;right:20px;background:none;border:none;color:#665544;
font-size:1.5em;cursor:pointer;transition:color 0.3s
}
.modal-close:hover{color:var(--accent)}
.modal-title{font-size:1.5em;color:#d4a574;letter-spacing:6px;margin-bottom:6px}
.modal-subtitle{font-size:0.85em;color:#665544;letter-spacing:3px;margin-bottom:20px}
.modal-desc{font-size:1em;line-height:1.9;color:#c4b8a0;margin-bottom:20px;white-space:pre-line}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px}
.modal-btn{
padding:10px 22px;background:transparent;border:1px solid #3a2520;color:#aa8866;
font-family:inherit;font-size:0.9em;cursor:pointer;border-radius:3px;letter-spacing:2px;
transition:all 0.3s
}
.modal-btn:hover{border-color:var(--accent);color:#ddaa88;background:rgba(139,0,0,0.1)}
.modal-btn.locked{opacity:0.4;cursor:not-allowed}
.site-footer{
background:#020102;border-top:1px solid #1a0a0a;padding:30px;text-align:center
}
.footer-text{color:#443322;font-size:0.8em;letter-spacing:3px}
[data-aos]{opacity:0;transition:all 0.8s cubic-bezier(0.25,0.46,0.45,0.94)}
[data-aos].aos-animate{opacity:1}
[data-aos="fade-up"]{transform:translateY(40px)}
[data-aos="fade-up"].aos-animate{transform:translateY(0)}
[data-aos="fade-right"]{transform:translateX(-40px)}
[data-aos="fade-right"].aos-animate{transform:translateX(0)}
[data-aos="fade-left"]{transform:translateX(40px)}
[data-aos="fade-left"].aos-animate{transform:translateX(0)}
[data-aos="zoom-in"]{transform:scale(0.9)}
[data-aos="zoom-in"].aos-animate{transform:scale(1)}
@media(max-width:768px){
.nav-menu{display:none}
.room-grid{grid-template-columns:1fr}
.section{padding:50px 16px}
.main-nav{padding:0 16px}
}
#toast{
position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:3000;
background:#0a0202;border:1px solid var(--accent);color:#ff6666;
padding:10px 24px;border-radius:4px;font-family:var(--font-serif);
letter-spacing:2px;font-size:0.9em;opacity:0;pointer-events:none;
transition:opacity 0.5s
}
#toast.show{opacity:1}
</style>
</head>

function renderRooms(){
var grid=document.getElementById("room-grid");grid.innerHTML="";
for(var i=0;i<rooms.length;i++){
var r=rooms[i];var card=document.createElement("div");
card.className="room-card";card.setAttribute("data-aos",i%2===0?"fade-right":"fade-left");
var status=S.visited[r.id]?"status-explored":"status-unexplored";
var statusText=S.visited[r.id]?"已探索":"未探索";
card.innerHTML='<div class="room-card-img">'+(r.emoji||"🏚️")+'</div><div class="room-card-body"><div class="room-card-title">'+r.name+'</div><div class="room-card-subtitle" style="font-size:0.75em;color:#665544;letter-spacing:2px">'+r.sub+'</div><div class="room-card-desc">'+(r.desc||"").substring(0,60)+'...</div><span class="room-card-status '+status+'">'+statusText+'</span></div>';
if(r.locked&&!S.events[r.unlock]){card.style.opacity="0.5";card.title="需要 "+r.unlock+" 才能进入";}
(function(room){card.addEventListener("click",function(){openRoom(room);});})(r);
grid.appendChild(card);}
triggerAOS();
}
function openRoom(r){
if(r.locked&&!S.events[r.unlock]){toast(r.unlock==="iron_key"?"需要铁钥匙才能进入地下室":"需要阁楼钥匙才能进入阁楼");return;}
if(!S.visited[r.id]){S.visited[r.id]=true;S.sanity=Math.max(0,S.sanity-3);addJournal(r.clue);}
document.getElementById("modal-title").textContent=r.name;
document.getElementById("modal-subtitle").textContent=r.sub;
document.getElementById("modal-desc").textContent=r.desc;
var actions=document.getElementById("modal-actions");actions.innerHTML="";
if(r.items)for(var i=0;i<r.items.length;i++){
var it=r.items[i];
if(it.needCandle&&!S.candle){continue;}
var btn=document.createElement("button");btn.className="modal-btn";btn.textContent=it.label;
(function(a){btn.addEventListener("click",function(){doItemAction(a,r.id);});})(it.act);
actions.appendChild(btn);}
document.getElementById("room-modal").classList.add("open");
updateHUD();renderRooms();
}
function closeModal(){document.getElementById("room-modal").classList.remove("open");}

case"study_floor":if(!S.events.study_floor){addModalText("烛光下你撬开了地板。天鹅绒袋子里装着最后一片钥匙碎片。所有碎片在你手中自动组合——封印钥匙形成了，散发出微弱而温暖的光芒。");S.pieces++;S.events.study_floor=true;S.inventory.push("封印钥匙");S.sealKey=true;toast("封印钥匙组合完成！")}else{addModalText("暗格已经空了。")}break;

case"attic_piece":if(!S.sealKey&&S.pieces>=4){S.inventory.push("封印钥匙");S.sealKey=true;addModalText("你捡起碎片。所有碎片在手中自动组合——封印钥匙形成了。它散发出微弱却坚定的光芒。");toast("封印钥匙组合完成！")}else if(S.sealKey){addModalText("封印钥匙已在你手中。")}else{addModalText("还缺"+ (4-S.pieces) +"片钥匙碎片。继续探索其他房间吧。")}break;

function addModalText(t){document.getElementById("modal-desc").textContent=t;}
function addJournal(text){S.journals.push(text);var je=document.getElementById("journal-entries");
if(S.journals.length===1){je.innerHTML="";}
var entry=document.createElement("div");
entry.style.cssText="padding:16px 20px;background:var(--card);border-left:3px solid var(--accent);border-radius:0 4px 4px 0;color:#aa9977;font-size:0.9em;line-height:1.7;margin-bottom:8px;";
entry.textContent="📜 "+text;
entry.setAttribute("data-aos","fade-left");
je.appendChild(entry);
setTimeout(function(){entry.classList.add("aos-animate")},100);
}

pt(523,"sine",1.5,0.06);setTimeout(function(){pt(659,"sine",1.5,0.06)},800);setTimeout(function(){pt(784,"sine",2,0.08)},1600);

function badEnding(){

function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},2500);}
function updateHUD(){
document.getElementById("sanity-fill").style.width=S.sanity+"%";
var sf=document.getElementById("sanity-fill");sf.className="sanity-fill";if(S.sanity<=25)sf.className="sanity-fill crit";else if(S.sanity<=50)sf.className="sanity-fill low";
document.getElementById("inv-count").textContent="物品 "+S.inventory.length;
if(S.sanity<=0&&!S.gameOver){S.gameOver=true;badEnding();}
}
function triggerAOS(){
var els=document.querySelectorAll("[data-aos]:not(.aos-animate)");
for(var i=0;i<els.length;i++){
var el=els[i];var rect=el.getBoundingClientRect();
if(rect.top<window.innerHeight*0.85){el.classList.add("aos-animate");}
}
}
(function(){
var cv=document.getElementById("particles");var cx=cv.getContext("2d");
var ps=[];function rs(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
function ip(){ps=[];for(var i=0;i<25;i++){ps.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:Math.random()*1.5+0.3,sx:(Math.random()-0.5)*0.2,sy:-Math.random()*0.4-0.05,o:Math.random()*0.4+0.05,l:Math.random()*150+50});}}
function ap(){cx.clearRect(0,0,cv.width,cv.height);for(var i=0;i<ps.length;i++){var p=ps[i];p.x+=p.sx;p.y+=p.sy;p.l--;if(p.l<=0||p.y<-10||p.x<-10||p.x>cv.width+10){p.x=Math.random()*cv.width;p.y=cv.height+10;p.l=Math.random()*150+50;}cx.fillStyle="rgba(180,160,130,"+p.o+")";cx.beginPath();cx.arc(p.x,p.y,p.s,0,Math.PI*2);cx.fill();}requestAnimationFrame(ap);}
rs();ip();ap();window.addEventListener("resize",function(){rs();ip();});
})();

if(b)b.addEventListener("click",function(){ia();drone();hb();document.getElementById("rooms").scrollIntoView({behavior:"smooth"});toast("你踏入了暗影宅邸...");renderRooms();});
});
document.getElementById("room-modal").addEventListener("click",function(e){if(e.target===this)closeModal();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
window.addEventListener("scroll",function(){
var sections=document.querySelectorAll("section[id]");var navs=document.querySelectorAll(".nav-item a");
var current="";
for(var i=0;i<sections.length;i++){var top=sections[i].offsetTop-100;if(window.scrollY>=top)current=sections[i].getAttribute("id");}
for(var j=0;j<navs.length;j++){navs[j].classList.remove("active");if(navs[j].getAttribute("href")==="#"+current)navs[j].classList.add("active");}
});
